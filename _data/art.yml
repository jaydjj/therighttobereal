# Illustrations for broadside panels. Files live in assets/art/<id>-<width>.webp (480, 800, 1120) plus <id>-800.jpg.
# Every illustration needs alt text that describes the scene, including any words shown in it.
crowd:
  alt: "Print-style illustration of a grey-haired woman in a denim jacket and work trousers standing calmly, hands in pockets, while a crowd hurries past under giant beauty billboards reading Your Best Skin Day, Healthy-Looking Glow, Find Your Glow, 30% Off, Free Gift and Early Access."
press:
  alt: "Print-style illustration of an old printing press in a factory, rolling out endless sheets of the same idealized woman's face and stacking them into piles, under a sweeping red sky."
walk:
  alt: "Print-style illustration of three women of different ages walking and talking along a sunlit country path, carrying books, past a blank billboard with a thin red outline of an idealized body."
