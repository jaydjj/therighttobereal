<!doctype html><html><head><meta charset="utf-8">
<!-- Renders the brand PNGs from the one shared logo, assets/logo.svg. -->
<style>
html,body{margin:0}
.box{display:grid;place-items:center}
#avatar{width:1080px;height:1080px;background:#1e4c9a}
#avatar img{width:640px;height:auto}
#wordmark{width:1600px;height:900px;background:#f8f6f0}
#wordmark img{width:1000px;height:auto}
</style></head><body>
<div class="box" id="avatar"><img id="light-logo" alt="The right to be real."></div>
<div class="box" id="wordmark"><img src="../assets/logo.svg" alt="The right to be real."></div>
<!-- The profile picture uses assets/logo.svg recoloured to #f8f6f0; the render script sets #light-logo's src. -->
</body></html>
