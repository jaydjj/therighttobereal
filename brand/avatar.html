<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
.a{width:1080px;height:1080px;background:#1e4c9a;display:grid;place-items:center;color:#f8f6f0}
.l{display:grid;justify-items:start;gap:22px}
.t{font:600 46px/1 "Work Sans",sans-serif;letter-spacing:.26em;text-transform:uppercase;padding-left:.12em}
.m{font:italic 400 300px/.8 "DM Serif Display",serif;letter-spacing:-.02em}
.m i{font-style:normal;color:#e3b341}
.b{width:1600px;height:900px;background:#f8f6f0;color:#1e4c9a;display:grid;place-items:center}
.b .t{font-size:52px}.b .m{font-size:340px}
</style></head><body>
<div class="a" id="avatar"><div class="l"><span class="t">The right to be</span><span class="m">Real<i>.</i></span></div></div>
<div class="b" id="wordmark"><div class="l"><span class="t">The right to be</span><span class="m">Real<i>.</i></span></div></div>
</body></html>
