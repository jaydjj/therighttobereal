{%- comment -%} Framed illustration. include.img = id in _data/art.yml; include.loading (default lazy) {%- endcomment -%}
{%- assign a = site.data.art[include.img] -%}
{%- assign base = '/assets/art/' | append: include.img | relative_url -%}
{%- assign full = a.w | at_most: 1120 -%}
<figure class="frame">
  <picture>
    <source type="image/webp" srcset="{{ base }}-480.webp 480w, {{ base }}-800.webp 800w, {{ base }}-{{ full }}.webp {{ full }}w" sizes="(max-width: 820px) 92vw, 460px">
    <img src="{{ base }}-800.jpg" alt="{{ a.alt | escape }}" width="{{ a.w }}" height="{{ a.h }}" loading="{{ include.loading | default: 'lazy' }}" decoding="async">
  </picture>
</figure>
