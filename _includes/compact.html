{%- comment -%} Compact event rows: date, then the name. include.items {%- endcomment -%}
<ol class="rows">
  {%- for e in include.items %}
  <li id="{{ e.id }}"{% if e.key %} class="row-key"{% endif %}><span class="label row-date">{{ e.date }}</span><span class="row-title">{{ e.title }}</span></li>
  {%- endfor %}
</ol>
