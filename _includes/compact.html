{%- comment -%} Compact event rows: date, then title with its tag. include.items {%- endcomment -%}
<ol class="also-list">
  {%- for e in include.items %}
  <li id="{{ e.id }}"{% if e.key %} class="also-key"{% endif %}><span class="also-date">{{ e.date }}</span><span class="also-title">{{ e.title }} <span class="tag tag-{{ e.tag }}">{{ e.tag | capitalize }}</span></span></li>
  {%- endfor %}
</ol>
