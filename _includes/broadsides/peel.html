<svg viewBox="0 0 360 400" role="img" aria-label="A woodcut of a beauty ad reading Flawless, its corner peeled back to reveal the words be real underneath.">
  <defs>
    <filter id="ink-p" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
  </defs>
  <g filter="url(#ink-p)">
    <!-- wall -->
    <rect x="0" y="0" width="360" height="400" fill="var(--ochre)"/>
    <g stroke="var(--ink)" stroke-width="1.6" opacity=".55"><path d="M0 70 H360"/><path d="M0 140 H360"/><path d="M0 210 H360"/><path d="M0 280 H360"/><path d="M0 350 H360"/></g>
    <!-- what's underneath: ink, with the real message -->
    <polygon points="320,200 320,372 172,372" fill="var(--ink)"/>
    <text x="312" y="356" text-anchor="end" font-family="DM Serif Display, Georgia, serif" font-style="italic" font-size="34" fill="var(--paper-hi)">be real.</text>
    <!-- the ad -->
    <polygon points="40,28 320,28 320,200 172,372 40,372" fill="var(--paper-hi)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
    <text x="180" y="88" text-anchor="middle" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="900" font-size="58" letter-spacing="3" fill="var(--ink)">FLAWLESS</text>
    <path d="M62 104 H298" stroke="var(--ink)" stroke-width="2"/>
    <!-- airbrushed face in profile, drawn as the ad would show it -->
    <g transform="translate(-6 -24)">
    <path d="M150 150 C120 152 104 180 108 212 C110 232 118 246 116 262 C114 282 104 296 96 312" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M150 150 C178 150 196 170 200 196 L210 214 L200 220 C202 236 196 248 184 252 L188 262 C182 270 170 272 160 270" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M170 196 C178 192 186 194 190 198" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M192 236 C186 240 180 240 176 238" stroke="var(--brick)" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <text x="298" y="124" text-anchor="end" font-family="Work Sans, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="var(--ink)">ADVERTISEMENT</text>
    <!-- the peeled corner -->
    <polygon points="320,200 172,372 162,236" fill="var(--ink)" opacity=".35" transform="translate(6 6)"/>
    <polygon points="320,200 172,372 162,236" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
    <g stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" opacity=".6"><path d="M200 250 L290 216"/><path d="M190 280 L268 244"/><path d="M182 310 L244 274"/></g>
  </g>
</svg>
