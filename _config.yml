title: The Right to Be Real
description: A social movement against the beauty standards corporations sell us. Collective action, starting with the Beauty Blackout on March 8, 2027.
url: https://therighttobereal.com
baseurl: ""
instagram: https://www.instagram.com/therighttobereal/
instagram_handle: "@therighttobereal"

# Pledge counter (Google Apps Script web app URL, see tools/pledge-sheet.gs). Empty = not connected yet.
pledge_endpoint: "https://script.google.com/macros/s/AKfycbyRhEr0_Uxxr37yZ7CA2C0C438Vzuyy9go952K7AewBB6eQDZzA0oXTLb9MYUPkJsq8qw/exec"
# Stepping goals: the count shows the next one ("2/100 pledges", "Be one of the first 100.").
# When a goal is passed, the next step takes over. Add bigger steps here if needed.
pledge_goals: [100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000]
# The count starts here: the site shows this number plus the pledges in the Sheet.
pledge_start: 2

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - CLAUDE.md
  - DESIGN.md
  - brand
  - tools
  - Gemfile
  - Gemfile.lock
  - vendor
