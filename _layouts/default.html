<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.url == "/" %}<title>{{ site.title }}</title>{% else %}<title>{{ page.title | strip_html }} · {{ site.title }}</title>{% endif %}
  <meta name="description" content="{{ page.description | default: page.summary | default: site.description | strip_html | escape }}">
  <meta property="og:title" content="{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title | strip_html }} · {{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: page.summary | default: site.description | strip_html | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#efe6d4" id="theme-color">
  <script>
    // Light or dark mode before the page paints: the visitor's choice (header toggle), else their device setting.
    (function () {
      var t; try { t = localStorage.getItem('rtbr-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('theme-color').content = t === 'dark' ? '#1a1714' : '#efe6d4';
    })();
  </script>
  <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}?v={{ site.time | date: '%s' }}" type="image/png">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}?v={{ site.time | date: '%s' }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="{{ page.body_class }}">
  {% include header.html %}
  <main id="top">
{{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
